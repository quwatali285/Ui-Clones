<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;

        }

        .box1 {
            font-size: 50px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .box3 {
            margin-top: 20px;
            background-color: rgb(58, 134, 58);
            /*     display: inline;*/
            font-size: 27px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;

        }

        .box4 {
            /*display: inline-flex;*/
            font-size: 27px;
            background-color: rgb(58, 134, 58);
            margin: 13px;
            width: fit-content;
            position: relative;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
        }

        input {
            height: 30p;
            width: 120px;
        }

        .container2 {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: end;
            background-color:black;
            height:30px;
            box-shadow: 0px -3px rgb(83, 83, 209);
        }

        .aaa {
            background-color: rgb(41, 38, 38);
            height: 13px;
            text-align: end;
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            width: fit-content;
            transform: rotate(90deg);
            position: relative;
            top: 8px;
        }
        .x{
            margin-top: 9px;
            width: 400px;
            height: 18px;
            background-color: rgb(237, 242, 250);
            border: 2px solid white;
            position: relative;
            left: 4px;
            box-shadow: -3px  0px rgb(0, 0, 0);
        }
    </style>
</head>

<body>
    <div class="container">
        <b>
            <div class="box1">HindMovie</div>
        </b>
        <div class="box">720 Movies,720 OP movies,720 OP movies,720 OP movies</div>
        <div class="box3">How to Download</div>
        <div class="box4">Hollywood Movies</div>
        <input type="text" placeholder="Search The website">
    </div>
    <div class="container2">
        <div class="aaa">
            I I I
        </div>
    </div>
    <input type="password" placeholder="Home" class="x">


</body>

</html>
